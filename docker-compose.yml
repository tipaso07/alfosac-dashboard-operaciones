services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alfosac_dashboard}
      POSTGRES_USER: ${POSTGRES_USER:-dashboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esta_clave}
    volumes:
      - dashboard_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: ${API_PORT:-5100}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dashboard_user}:${POSTGRES_PASSWORD:-cambia_esta_clave}@db:5432/${POSTGRES_DB:-alfosac_dashboard}
      FALCON_SYNC_ENABLED: ${FALCON_SYNC_ENABLED:-false}
      FALCON_DB_HOST: ${FALCON_DB_HOST:-}
      FALCON_DB_PORT: ${FALCON_DB_PORT:-1433}
      FALCON_EXTRANET_DB: ${FALCON_EXTRANET_DB:-}
      FALCON_MAESTROS_DB: ${FALCON_MAESTROS_DB:-}
      FALCON_DB_USER: ${FALCON_DB_USER:-}
      FALCON_DB_PASSWORD: ${FALCON_DB_PASSWORD:-}
      FALCON_DB_ENCRYPT: ${FALCON_DB_ENCRYPT:-false}
      FALCON_DB_TRUST_CERTIFICATE: ${FALCON_DB_TRUST_CERTIFICATE:-true}
      FALCON_SYNC_INTERVAL_SECONDS: ${FALCON_SYNC_INTERVAL_SECONDS:-60}
      GITS_SYNC_ENABLED: ${GITS_SYNC_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5100}:5100"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - "${TV_PORT:-8090}:80"

volumes:
  dashboard_db_data:

